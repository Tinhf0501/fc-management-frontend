<div class="d-flex flex-column h-100 row-gap-4">
    <match-result-create-form></match-result-create-form>
    <div class="d-flex flex-column row-gap-3 h-100">
        <div class="flex-grow-1">
            <scorer-grid [pagination]="pagination"></scorer-grid>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2">
        <fms-button
            [icon]="'plus'"
            [label]="'COMMON.SAVE' | translate"
        ></fms-button>
        <fms-button
            [icon]="'arrow-left'"
            [label]="'COMMON.GO_BACK' | translate"
            (click)="goBack()"
        ></fms-button>
    </div>
</div>
