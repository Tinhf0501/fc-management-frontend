<ul nz-menu nzMode="inline" nzTheme="dark" [nzInlineCollapsed]="isCollapsed">
    <li nz-menu-item [nzPaddingLeft]="24">
        <!-- Sidebar - Brand -->
        <a [routerLink]="'/'">
            <fms-icon
                class="anticon logo-admin"
                [iconName]="'smile'"
            ></fms-icon>
            <span class="h5 ml-10px mb-0px">SB Admin <sup>2</sup></span>
        </a>
    </li>
    <li nz-menu-divider></li>
    <ng-container
        *ngTemplateOutlet="menuTpl; context: { menus: menus, level: 1 }"
    ></ng-container>
    <ng-template #menuTpl let-menus="menus" let-level="level">
        <ng-container *ngFor="let menu of menus">
            <li
                *ngIf="!menu.children"
                nz-menu-item
                [nzDisabled]="menu.disabled"
                [nzSelected]="menu.selected"
                nz-tooltip
                [nzTooltipTitle]="menu.label | translate"
                nzMatchRouter
                [nzPaddingLeft]="level * 24"
            >
                <a [routerLink]="menu.link">
                    <fms-icon
                        class="anticon"
                        [iconName]="menu.icon"
                        *ngIf="menu.icon"
                    ></fms-icon>
                    <span class="text-capitalize text-truncate">{{
                        menu.label | translate
                    }}</span>
                </a>
            </li>
            <li
                *ngIf="menu.children"
                nz-submenu
                [nzTitle]="menu.label | translate"
                [nzIcon]="menu.icon"
                nz-tooltip
                [nzTooltipTitle]="menu.label | translate"
                [nzPaddingLeft]="level * 24"
            >
                <ul>
                    <ng-container
                        *ngTemplateOutlet="
                            menuTpl;
                            context: { menus: menu.children, level: level + 1 }
                        "
                    ></ng-container>
                </ul>
            </li>
        </ng-container>
    </ng-template>
</ul>
