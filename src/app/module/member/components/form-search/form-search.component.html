<fms-search-form [formGroup]="formGroup" class="d-flex flex-column row-gap-3">
    <div nz-row [nzGutter]="[16, 16]">
        <div nz-col nzLg="8" nzMd="12" nzSm="24" nzXs="24">
            <fms-input
                [label]="'MEMBER.FULLNAME' | translate"
                [placeholder]="'MEMBER.INPUT_FULLNAME' | translate"
                formControlName="fullName"
                [control]="formGroup.get('fullName')"
            ></fms-input>
        </div>

        <div nz-col nzLg="8" nzMd="12" nzSm="24" nzXs="24">
            <fms-select
                [label]="'COMMON.STATUS' | translate"
                formControlName="status"
                [items]="items"
                [control]="formGroup.get('status')"
            ></fms-select>
        </div>

        <div nz-col nzLg="8" nzMd="12" nzSm="24" nzXs="24">
            <div nz-row [nzAlign]="'bottom'" [nzGutter]="[16, 16]">
                <div nz-col nzMd="12" nzSm="24" nzXs="24">
                    <fms-date
                        formControlName="fromDate"
                        [label]="'MEMBER.JOINED_DATE' | translate"
                        [control]="formGroup.get('fromDate')"
                    ></fms-date>
                </div>

                <div nz-col nzMd="12" nzSm="24" nzXs="24">
                    <fms-date
                        formControlName="toDate"
                        [control]="formGroup.get('toDate')"
                    ></fms-date>
                </div>
            </div>
        </div>

        <div nz-col nzLg="8" nzMd="12" nzSm="24" nzXs="24">
            <fms-select
                [label]="'COMMON.FC' | translate"
                formControlName="fc"
                [items]="items"
                [control]="formGroup.get('fc')"
            ></fms-select>
        </div>

        <div nz-col nzLg="8" nzMd="12" nzSm="24" nzXs="24">
            <position-select
                [value]="formGroup.get('position').value"
                (change)="formGroup.get('position').setValue($event)"
            ></position-select>
        </div>

        <div nz-col nzLg="8" nzMd="12" nzSm="24" nzXs="24">
            <fms-select
                [label]="'ACCOUNT.ACC' | translate"
                formControlName="account"
                [items]="items"
                [control]="formGroup.get('account')"
            ></fms-select>
        </div>
    </div>
</fms-search-form>
