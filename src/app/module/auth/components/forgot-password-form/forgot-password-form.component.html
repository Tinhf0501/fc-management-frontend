<form class="user" [formGroup]="forgotPasswordFormGroup">
    <div class="form-group">
        <fms-input
            [type]="'email'"
            [placeholder]="'AUTH.INPUT_EMAIL' | translate"
            formControlName="email"
            [control]="forgotPasswordFormGroup.get('email')"
            [required]="true"
        ></fms-input>
    </div>
    <fms-button [label]="'FORGOT_PASSWORD.RESET_PASSWORD' | translate"></fms-button>
</form>
