<form [formGroup]="formGroup" class="d-flex flex-column row-gap-3">
    <div class="row row-gap-3">
        <div class="col-md-12">
            <fms-select
                [items]="items | signal"
                [placeholder]="'MATCH_RESULT.NAME' | translate"
                [label]="'MATCH_RESULT.NAME' | translate"
                [required]="true"
                formControlName="resultName"
                [control]="formGroup.get('resultName')"
            ></fms-select>
        </div>

        <div class="col-md-12">
            <label class="fw-semibold required">{{
                'COMMON.FC' | translate
            }}</label>
            <div class="row row-gap-3">
                <div class="col-md-9">
                    <fms-select
                        [items]="items | signal"
                        [placeholder]="'COMMON.SELECT_FC' | translate"
                        [required]="true"
                        formControlName="fc1"
                        [control]="formGroup.get('fc1')"
                    ></fms-select>
                </div>
                <div class="col-md-3">
                    <fms-input
                        [type]="'number'"
                        [placeholder]="'MATCH_RESULT.SCORE' | translate"
                        formControlName="resultScore1"
                        [control]="formGroup.get('resultScore1')"
                        [required]="true"
                    ></fms-input>
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <label class="fw-semibold required">{{
                'COMMON.FC' | translate
            }}</label>
            <div class="row row-gap-3">
                <div class="col-md-9">
                    <fms-select
                        [items]="items | signal"
                        [placeholder]="'COMMON.SELECT_FC' | translate"
                        [required]="true"
                        formControlName="fc2"
                        [control]="formGroup.get('fc2')"
                    ></fms-select>
                </div>
                <div class="col-md-3">
                    <fms-input
                        [type]="'number'"
                        [placeholder]="'MATCH_RESULT.SCORE' | translate"
                        [required]="true"
                        formControlName="resultScore2"
                        [control]="formGroup.get('resultScore2')"
                    ></fms-input>
                </div>
            </div>
        </div>
    </div>
</form>
